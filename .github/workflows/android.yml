name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Cari folder proyek otomatis
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z" -d _src && echo "Zip diekstrak: $z"; done
          CFG=$(find . -name capacitor.config.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$CFG" ]; then echo "capacitor.config.json tidak ditemukan. Pastikan semua file proyek terupload."; ls -R | head -50; exit 1; fi
          echo "APP_DIR=$(dirname "$CFG")" >> "$GITHUB_ENV"
          echo "Proyek ditemukan di: $(dirname "$CFG")"
      - name: Install dependensi
        working-directory: ${{ env.APP_DIR }}
        run: npm install
      - name: Tambah platform Android
        working-directory: ${{ env.APP_DIR }}
        run: npx cap add android
      - name: Izin & pemutaran latar belakang
        working-directory: ${{ env.APP_DIR }}
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' "$M"
          cat > android/app/src/main/java/com/musikglass/app/MainActivity.java <<'JAVA'
          package com.musikglass.app;

          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onPause() {
              super.onPause();
              WebView wv = getBridge() != null ? getBridge().getWebView() : null;
              if (wv != null) wv.resumeTimers();
            }
          }
          JAVA
      - name: Sinkronkan web ke Android
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android
      - name: Build APK (debug, bisa langsung di-install)
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: musik-glass-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
