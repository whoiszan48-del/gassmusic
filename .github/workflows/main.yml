name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Tambah platform Android
        run: npx cap add android
      - name: Izin & pemutaran latar belakang
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' "$M"
          cat > android/app/src/main/java/com/musikglass/app/MainActivity.java <<'JAVA'
          package com.musikglass.app;

          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onPause() {
              super.onPause();
              // Jaga agar JS/timer WebView tetap berjalan saat aplikasi di latar belakang
              WebView wv = getBridge() != null ? getBridge().getWebView() : null;
              if (wv != null) wv.resumeTimers();
            }
          }
          JAVA
      - run: npx cap sync android
      - name: Build APK (debug, bisa langsung di-install)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: musik-glass-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
